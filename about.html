<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>about</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
        body {
            font-weight: 300;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 28px;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        p {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 240px;
            margin: 0;
            font-size: clamp(11px, 1.1vw, 14px);
            line-height: 1.2;
            text-transform: lowercase;
        }

        .redacted {
            background: #000;
            color: transparent;
            cursor: default;
        }

        .redacted:hover,
        .redacted:focus {
            background: transparent;
            color: inherit;
            outline: none;
        }
    </style>
</head>
<body>
    <main>
        <a class="site-home-i" href="index.html">i</a>
        <p>
            <span>Thoughts rise to the surface slowly, like bubbles. (Sometimes it's as though you could see a thought, and idea, as an <span class="redacted" tabindex="0">indistinct</span> point far away on the horizon; and then it approaches with astonishing swiftness.)</span>
        </p>
    </main>
    <script src="router.js"></script>
</body>
</html>
