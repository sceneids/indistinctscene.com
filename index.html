<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indistinct Scene</title>
    <meta name="application-name" content="Indistinct Scene" />
    <meta property="og:site_name" content="Indistinct Scene" />
    <meta property="og:title" content="Indistinct Scene" />
    <meta property="og:url" content="https://indistinctscene.com/" />
    <link rel="canonical" href="https://indistinctscene.com/" />
    <link rel="stylesheet" href="shared.css" />
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://indistinctscene.com/#website",
            "url": "https://indistinctscene.com/",
            "name": "Indistinct Scene",
            "alternateName": "indistinctscene.com"
        }
    </script>
    <style>
        body {
            overflow: hidden;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url("mila.jpg") center / contain no-repeat;
            pointer-events: none;
        }

        .time-location {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 14px;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .local-time {
            color: #aaa;
        }

        .home-mark {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
        }

        .center-i {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            font-size: 34px;
            font-weight: 400;
        }

        .orbit-link:hover,
        .orbit-link:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .orbit-link:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .orbit {
            --radius: clamp(86px, 12.5vw, 126px);
            --orbit-duration: 20s;
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            width: 0;
            height: 0;
            animation: orbit-spin var(--orbit-duration) linear infinite;
        }

        .orbit-item {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
        }

        .orbit-item.contact {
            top: calc(-1 * var(--radius));
        }

        .orbit-item.mixes {
            top: var(--radius);
        }

        .orbit-item.archive {
            left: calc(-1 * var(--radius));
        }

        .orbit-item.consume {
            left: var(--radius);
        }

        .orbit:hover,
        .orbit:focus-within,
        .orbit:hover .orbit-link,
        .orbit:focus-within .orbit-link {
            animation-play-state: paused;
        }

        @keyframes orbit-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .orbit,
            .orbit-link {
                animation: none;
            }
        }

        .orbit-link {
            animation: orbit-spin var(--orbit-duration) linear infinite reverse;
            display: block;
            color: #000;
            font-size: clamp(14px, 1.35vw, 17px);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .time-location {
                left: auto;
                right: 20px;
                gap: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <div class="time-location" aria-label="24-hour local time and approximate location">
        <time class="local-time" id="local-time"></time>
        <span id="visitor-location"></span>
    </div>

    <main class="home-mark" aria-label="Indistinct Scene">
        <a class="center-i" href="index.html" aria-label="Indistinct Scene home">i</a>
    </main>

    <nav class="orbit" aria-label="Site sections">
        <div class="orbit-item mixes">
            <a class="orbit-link" href="mixes.html">mixes</a>
        </div>

        <div class="orbit-item consume">
            <a class="orbit-link" href="consume.html">consume</a>
        </div>

        <div class="orbit-item contact">
            <a class="orbit-link" href="contact.html">contact</a>
        </div>

        <div class="orbit-item archive">
            <a class="orbit-link" href="archive.html">archive</a>
        </div>
    </nav>

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const localTime = document.getElementById("local-time");
        const visitorLocation = document.getElementById("visitor-location");
        const browserTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        let localTimeFormat;

        function getLocationName(timeZone) {
            const timeZoneParts = timeZone.split("/");
            const locationName = timeZoneParts[timeZoneParts.length - 1];

            return locationName.replaceAll("_", " ");
        }

        function updateLocalTime() {
            const now = new Date();
            localTime.textContent = localTimeFormat.format(now);
            localTime.dateTime = now.toISOString();
        }

        function setClockLocation(timeZone, locationName) {
            try {
                localTimeFormat = new Intl.DateTimeFormat("en-GB", {
                    timeZone,
                    hour: "2-digit",
                    minute: "2-digit",
                    hourCycle: "h23"
                });
            } catch {
                timeZone = browserTimeZone;
                localTimeFormat = new Intl.DateTimeFormat("en-GB", {
                    timeZone,
                    hour: "2-digit",
                    minute: "2-digit",
                    hourCycle: "h23"
                });
            }

            visitorLocation.textContent = locationName || getLocationName(timeZone);
            updateLocalTime();
        }

        async function locateVisitorByIp() {
            try {
                const response = await fetch(
                    "https://ipwho.is/?fields=success,city,region,country_code,timezone",
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Location lookup failed");
                }

                const location = await response.json();
                if (!location.success || !location.timezone?.id) {
                    throw new Error("Location lookup returned no timezone");
                }

                const locationName = location.city
                    || location.region
                    || location.country_code
                    || getLocationName(location.timezone.id);

                setClockLocation(location.timezone.id, locationName);
            } catch {
                // Keep the browser timezone fallback when IP geolocation is unavailable.
            }
        }

        setClockLocation(browserTimeZone);
        locateVisitorByIp();
        setInterval(updateLocalTime, 30000);
    </script>
    <script src="router.js"></script>
</body>
</html>
