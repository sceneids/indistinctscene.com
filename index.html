<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indistinct Scene</title>
    <meta name="application-name" content="Indistinct Scene" />
    <meta property="og:site_name" content="Indistinct Scene" />
    <meta property="og:title" content="Indistinct Scene" />
    <meta property="og:url" content="https://indistinctscene.com/" />
    <link rel="canonical" href="https://indistinctscene.com/" />
    <link rel="stylesheet" href="shared.css" />
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://indistinctscene.com/#website",
            "url": "https://indistinctscene.com/",
            "name": "Indistinct Scene",
            "alternateName": "indistinctscene.com"
        }
    </script>
    <style>
        body {
            overflow: hidden;
        }

        .tracker {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #222;
            font-size: 11px;
            line-height: 1;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .location-wrap {
            position: relative;
            display: block;
        }

        .visitor-location {
            display: block;
            padding: 1px 2px;
        }

        .tracker.is-redacted .visitor-location {
            background: #000;
            color: transparent;
            user-select: none;
        }

        .signal {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 6px 1px rgba(29, 185, 84, 0.8);
        }

        .signal::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid #1db954;
            border-radius: 50%;
            animation: signal-ping 2s ease-out infinite;
        }

        @keyframes signal-ping {
            0% {
                opacity: 0.9;
                transform: scale(1);
            }

            70%,
            100% {
                opacity: 0;
                transform: scale(4.5);
            }
        }

        .about-link {
            display: block;
            box-sizing: content-box;
            width: 8px;
            height: 8px;
            margin: -6px;
            padding: 6px;
            color: #222;
        }

        .about-link svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .about-link:hover,
        .about-link:focus-visible {
            color: #1db954;
        }

        /* The man starts hidden behind the left end of the redaction bar: this box clips him there. */
        .balloon-man {
            --start: 0.4s;
            position: absolute;
            right: 100%;
            bottom: 0;
            width: 44px;
            height: 28px;
            overflow: hidden;
            pointer-events: none;
        }

        .balloon-man svg {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 16px;
            height: 26px;
            overflow: visible;
            transform: translateX(100%);
        }

        .man-leg {
            transform-origin: 8px 21.4px;
        }

        .balloon ellipse {
            transform-box: fill-box;
            transform-origin: center;
        }

        .burst {
            opacity: 0;
        }

        .tracker.is-redacted .balloon-man svg {
            animation:
                man-walk 1.5s linear var(--start) forwards,
                man-vanish 0.08s linear calc(var(--start) + 2.2s) forwards;
        }

        .tracker.is-redacted .man-leg {
            animation: man-step 0.375s linear var(--start) 4;
        }

        .tracker.is-redacted .man-leg.back {
            animation-direction: reverse;
        }

        .tracker.is-redacted .balloon.one ellipse,
        .tracker.is-redacted .balloon.one line {
            animation: balloon-pop 0.12s ease-in calc(var(--start) + 1.7s) forwards;
        }

        .tracker.is-redacted .balloon.two ellipse,
        .tracker.is-redacted .balloon.two line {
            animation: balloon-pop 0.12s ease-in calc(var(--start) + 1.9s) forwards;
        }

        .tracker.is-redacted .burst.one {
            animation: balloon-burst 0.2s linear calc(var(--start) + 1.8s);
        }

        .tracker.is-redacted .burst.two {
            animation: balloon-burst 0.2s linear calc(var(--start) + 2s);
        }

        @keyframes man-walk {
            to {
                transform: translateX(-18px);
            }
        }

        @keyframes man-step {
            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(22deg);
            }

            75% {
                transform: rotate(-22deg);
            }
        }

        @keyframes man-vanish {
            to {
                opacity: 0;
            }
        }

        @keyframes balloon-pop {
            80% {
                opacity: 1;
                transform: scale(1.4);
            }

            100% {
                opacity: 0;
                transform: scale(1.4);
            }
        }

        @keyframes balloon-burst {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .signal::after {
                animation: none;
            }

            .balloon-man {
                display: none;
            }
        }

        .home-mark {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
        }

        .center-i {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            font-size: 34px;
            font-weight: 400;
        }

        .orbit-item {
            --radius: clamp(86px, 12.5vw, 126px);
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .orbit-item.contact {
            top: calc(50% - var(--radius));
        }

        .orbit-item.mixes {
            top: calc(50% + var(--radius));
        }

        .orbit-item.archive {
            left: calc(50% - var(--radius));
        }

        .orbit-item.consume {
            left: calc(50% + var(--radius));
        }

        .section-link {
            display: block;
            color: #000;
            font-size: clamp(14px, 1.35vw, 17px);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .section-link:hover,
        .section-link:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .section-link:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .corner-zebra {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1;
            width: auto;
            height: 44px;
            pointer-events: none;
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .tracker {
                left: auto;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="tracker" id="tracker" aria-label="Approximate location">
        <span class="location-wrap">
            <span class="balloon-man" aria-hidden="true">
                <svg viewBox="0 0 16 26">
                    <g class="balloon one">
                        <line x1="4.2" y1="15.6" x2="3.6" y2="9.4" stroke="#000" stroke-width="0.3" />
                        <ellipse cx="3.6" cy="6.6" rx="2.3" ry="2.8" fill="#d6202a" />
                    </g>
                    <g class="balloon two">
                        <line x1="11.8" y1="15.6" x2="12.4" y2="8.6" stroke="#000" stroke-width="0.3" />
                        <ellipse cx="12.4" cy="5.8" rx="2.3" ry="2.8" fill="#d6202a" />
                    </g>
                    <path class="burst one" d="M3.6 3v1.4M3.6 10.2V8.8M0 6.6h1.4M7.2 6.6H5.8M1.1 4.1l1 1M6.1 9.1l-1-1M6.1 4.1l-1 1M1.1 9.1l1-1" stroke="#d6202a" stroke-width="0.5" />
                    <path class="burst two" d="M12.4 2.2v1.4M12.4 9.4V8M8.8 5.8h1.4M16 5.8h-1.4M9.9 3.3l1 1M14.9 8.3l-1-1M14.9 3.3l-1 1M9.9 8.3l1-1" stroke="#d6202a" stroke-width="0.5" />
                    <path d="M6.5 17.4L4.2 15.6M9.5 17.4l2.3-1.8" stroke="#000" stroke-width="0.9" stroke-linecap="round" />
                    <line class="man-leg" x1="7.4" y1="21.4" x2="7.2" y2="26" stroke="#000" stroke-width="1.2" />
                    <line class="man-leg back" x1="8.6" y1="21.4" x2="8.8" y2="26" stroke="#000" stroke-width="1.2" />
                    <circle cx="8" cy="14.9" r="1.7" fill="#000" />
                    <rect x="6.2" y="16.8" width="3.6" height="5" rx="0.6" fill="#000" />
                    <path d="M7.4 16.8h1.2L8 19z" fill="#fff" />
                </svg>
            </span>
            <span class="visitor-location" id="visitor-location"></span>
        </span>
        <span class="signal" aria-hidden="true"></span>
        <a class="about-link" href="about.html" aria-label="About">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
                <circle cx="8" cy="4.6" r="1.2" fill="currentColor" />
                <rect x="7.1" y="6.8" width="1.8" height="5.4" fill="currentColor" />
            </svg>
        </a>
    </div>

    <main class="home-mark" aria-label="Indistinct Scene">
        <a class="center-i" href="index.html" aria-label="Indistinct Scene home">i</a>
    </main>

    <nav aria-label="Site sections">
        <div class="orbit-item mixes">
            <a class="section-link" href="mixes.html">mixes</a>
        </div>

        <div class="orbit-item consume">
            <a class="section-link" href="consume.html">consume</a>
        </div>

        <div class="orbit-item contact">
            <a class="section-link" href="contact.html">contact</a>
        </div>

        <div class="orbit-item archive">
            <a class="section-link" href="archive.html">archive</a>
        </div>
    </nav>

    <img class="corner-zebra" src="zebra-corner.jpg" alt="" aria-hidden="true" />

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const tracker = document.getElementById("tracker");
        const visitorLocation = document.getElementById("visitor-location");
        const browserTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

        async function locateVisitorByIp() {
            try {
                const response = await fetch(
                    "https://ipwho.is/?fields=success,city,region,country_code",
                    { cache: "no-store" }
                );
                const location = await response.json();
                const locationName = location.success
                    && (location.city || location.region || location.country_code);

                if (locationName && !tracker.classList.contains("is-redacted")) {
                    visitorLocation.textContent = locationName;
                }
            } catch {
                // Keep the browser timezone fallback when IP geolocation is unavailable.
            }
        }

        visitorLocation.textContent = browserTimeZone.split("/").pop().replaceAll("_", " ");
        locateVisitorByIp();
        setTimeout(() => tracker.classList.add("is-redacted"), 5000);
    </script>
    <script src="router.js"></script>
</body>
</html>
