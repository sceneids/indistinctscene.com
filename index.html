<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indistinct Scene</title>
    <meta name="application-name" content="Indistinct Scene" />
    <meta property="og:site_name" content="Indistinct Scene" />
    <meta property="og:title" content="Indistinct Scene" />
    <meta property="og:url" content="https://indistinctscene.com/" />
    <link rel="canonical" href="https://indistinctscene.com/" />
    <link rel="stylesheet" href="shared.css" />
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://indistinctscene.com/#website",
            "url": "https://indistinctscene.com/",
            "name": "Indistinct Scene",
            "alternateName": "indistinctscene.com"
        }
    </script>
    <style>
        body {
            overflow: hidden;
        }

        .time-location {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 3;
            display: flex;
            align-items: baseline;
            gap: 14px;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .local-time {
            color: #aaa;
        }

        .live-dot {
            align-self: center;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            animation: live-dot-pulse 2.4s ease-in-out infinite;
        }

        .about-link {
            align-self: center;
            display: block;
            box-sizing: content-box;
            width: 8px;
            height: 8px;
            margin: -6px;
            padding: 6px;
            color: #222;
        }

        .about-link svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .about-link:hover,
        .about-link:focus-visible {
            color: #1db954;
        }

        @keyframes live-dot-pulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .live-dot {
                animation: none;
            }
        }

        .home-mark {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
        }

        .center-i {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            font-size: 34px;
            font-weight: 400;
        }

        .orbit-item {
            --radius: clamp(86px, 12.5vw, 126px);
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .orbit-item.contact {
            top: calc(50% - var(--radius));
        }

        .orbit-item.mixes {
            top: calc(50% + var(--radius));
        }

        .orbit-item.archive {
            left: calc(50% - var(--radius));
        }

        .orbit-item.consume {
            left: calc(50% + var(--radius));
        }

        .section-link {
            display: block;
            color: #000;
            font-size: clamp(14px, 1.35vw, 17px);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .section-link:hover,
        .section-link:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .section-link:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .corner-zebra {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1;
            width: auto;
            height: 44px;
            pointer-events: none;
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .time-location {
                left: auto;
                right: 20px;
                gap: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="time-location" aria-label="24-hour local time and approximate location">
        <span class="live-dot" aria-hidden="true"></span>
        <a class="about-link" href="about.html" aria-label="About">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
                <circle cx="8" cy="4.6" r="1.2" fill="currentColor" />
                <rect x="7.1" y="6.8" width="1.8" height="5.4" fill="currentColor" />
            </svg>
        </a>
        <time class="local-time" id="local-time"></time>
        <span id="visitor-location"></span>
    </div>

    <main class="home-mark" aria-label="Indistinct Scene">
        <a class="center-i" href="index.html" aria-label="Indistinct Scene home">i</a>
    </main>

    <nav aria-label="Site sections">
        <div class="orbit-item mixes">
            <a class="section-link" href="mixes.html">mixes</a>
        </div>

        <div class="orbit-item consume">
            <a class="section-link" href="consume.html">consume</a>
        </div>

        <div class="orbit-item contact">
            <a class="section-link" href="contact.html">contact</a>
        </div>

        <div class="orbit-item archive">
            <a class="section-link" href="archive.html">archive</a>
        </div>
    </nav>

    <img class="corner-zebra" src="zebra-corner.jpg" alt="" aria-hidden="true" />

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const localTime = document.getElementById("local-time");
        const visitorLocation = document.getElementById("visitor-location");
        const browserTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        let localTimeFormat;

        function getLocationName(timeZone) {
            const timeZoneParts = timeZone.split("/");
            const locationName = timeZoneParts[timeZoneParts.length - 1];

            return locationName.replaceAll("_", " ");
        }

        function updateLocalTime() {
            const now = new Date();
            localTime.textContent = localTimeFormat.format(now);
            localTime.dateTime = now.toISOString();
        }

        function setClockLocation(timeZone, locationName) {
            try {
                localTimeFormat = new Intl.DateTimeFormat("en-GB", {
                    timeZone,
                    hour: "2-digit",
                    minute: "2-digit",
                    hourCycle: "h23"
                });
            } catch {
                timeZone = browserTimeZone;
                localTimeFormat = new Intl.DateTimeFormat("en-GB", {
                    timeZone,
                    hour: "2-digit",
                    minute: "2-digit",
                    hourCycle: "h23"
                });
            }

            visitorLocation.textContent = locationName || getLocationName(timeZone);
            updateLocalTime();
        }

        async function locateVisitorByIp() {
            try {
                const response = await fetch(
                    "https://ipwho.is/?fields=success,city,region,country_code,timezone",
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("Location lookup failed");
                }

                const location = await response.json();
                if (!location.success || !location.timezone?.id) {
                    throw new Error("Location lookup returned no timezone");
                }

                const locationName = location.city
                    || location.region
                    || location.country_code
                    || getLocationName(location.timezone.id);

                setClockLocation(location.timezone.id, locationName);
            } catch {
                // Keep the browser timezone fallback when IP geolocation is unavailable.
            }
        }

        setClockLocation(browserTimeZone);
        locateVisitorByIp();
        setInterval(updateLocalTime, 30000);
    </script>
    <script src="router.js"></script>
</body>
</html>
