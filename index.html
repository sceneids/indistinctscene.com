<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indistinct Scene</title>
    <meta name="application-name" content="Indistinct Scene" />
    <meta property="og:site_name" content="Indistinct Scene" />
    <meta property="og:title" content="Indistinct Scene" />
    <meta property="og:url" content="https://indistinctscene.com/" />
    <link rel="canonical" href="https://indistinctscene.com/" />
    <link rel="stylesheet" href="shared.css" />
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "@id": "https://indistinctscene.com/#website",
            "url": "https://indistinctscene.com/",
            "name": "Indistinct Scene",
            "alternateName": "indistinctscene.com"
        }
    </script>
    <style>
        html {
            /* Vertical swipes turn the word wheel instead of scrolling or pulling to refresh. */
            overscroll-behavior: none;
            touch-action: pan-x pinch-zoom;
        }

        body {
            overflow: hidden;
        }

        .tracker {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #222;
            font-size: 11px;
            line-height: 1;
            text-transform: lowercase;
            white-space: nowrap;
        }

        .signal {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 6px 1px rgba(29, 185, 84, 0.8);
        }

        .signal::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid #1db954;
            border-radius: 50%;
            animation: signal-ping 2s ease-out infinite;
        }

        @keyframes signal-ping {
            0% {
                opacity: 0.9;
                transform: scale(1);
            }

            70%,
            100% {
                opacity: 0;
                transform: scale(4.5);
            }
        }

        .about-link {
            display: block;
            box-sizing: content-box;
            width: 8px;
            height: 8px;
            margin: -6px;
            padding: 6px;
            color: #222;
        }

        .about-link svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .about-link:hover,
        .about-link:focus-visible {
            color: #1db954;
        }

        @media (prefers-reduced-motion: reduce) {
            .signal::after {
                animation: none;
            }
        }

        /* The plate is deliberately stretched sideways into a band (object-fit: fill); the 17vw cap keeps it wider than its natural shape on narrow screens. */
        .stripe {
            position: fixed;
            left: 0;
            top: 50%;
            z-index: 1;
            width: 100%;
            height: min(clamp(90px, 18vh, 150px), 17vw);
            object-fit: fill;
            transform: translateY(-50%);
            pointer-events: none;
            user-select: none;
        }

        /*
            The word wheel: five words stacked through the middle of the page.
            data-pos is each word's slot (-2 top ... 0 centre ... 2 bottom);
            -3 and 3 are hidden slots just past the ends, used while a word wraps round.
        */
        .wheel {
            --big: clamp(46px, 7.5vw, 92px);
            --small: clamp(14px, 1.35vw, 17px);
            --near: clamp(86px, 12.5vw, 126px);
            --step: clamp(26px, 3vw, 34px);
        }

        .wheel-item {
            --y: 0px;
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            color: #000;
            font-size: var(--small);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
            transform: translate(-50%, calc(-50% + var(--y)));
            transition: transform 0.35s ease, font-size 0.35s ease, opacity 0.35s ease;
        }

        .wheel-item[data-pos="0"] {
            font-size: var(--big);
        }

        .wheel-item[data-pos="-1"] {
            --y: calc(-1 * var(--near));
        }

        .wheel-item[data-pos="1"] {
            --y: var(--near);
        }

        .wheel-item[data-pos="-2"] {
            --y: calc(-1 * (var(--near) + var(--step)));
        }

        .wheel-item[data-pos="2"] {
            --y: calc(var(--near) + var(--step));
        }

        .wheel-item[data-pos="-3"] {
            --y: calc(-1 * (var(--near) + 2 * var(--step)));
        }

        .wheel-item[data-pos="3"] {
            --y: calc(var(--near) + 2 * var(--step));
        }

        .wheel-item[data-pos="-3"],
        .wheel-item[data-pos="3"] {
            opacity: 0;
            pointer-events: none;
        }

        .wheel-item.is-teleporting {
            transition: none;
        }

        .wheel-item sup {
            font-size: 0.26em;
            line-height: 1;
            vertical-align: baseline;
            margin-left: 0.15em;
        }

        .wheel-item:not([data-pos="0"]):hover,
        .wheel-item:not([data-pos="0"]):focus-visible {
            color: #fff;
            background: #000;
        }

        .wheel-item:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .wheel-item {
                transition: none;
            }
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .tracker {
                left: auto;
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="tracker" aria-label="Approximate location">
        <span id="visitor-location"></span>
        <span class="signal" aria-hidden="true"></span>
        <a class="about-link" href="about.html" aria-label="About">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
                <circle cx="8" cy="4.6" r="1.2" fill="currentColor" />
                <rect x="7.1" y="6.8" width="1.8" height="5.4" fill="currentColor" />
            </svg>
        </a>
    </div>

    <img class="stripe" src="id-plate.png" alt="" aria-hidden="true" />

    <main aria-label="Indistinct Scene">
        <nav class="wheel" aria-label="Site sections">
            <a class="wheel-item" data-pos="-2" href="archive.html">archive</a>
            <a class="wheel-item" data-pos="-1" href="contact.html">contact</a>
            <a class="wheel-item" data-pos="0" href="index.html" aria-label="Indistinct Scene home">SCENE<sup>&trade;</sup></a>
            <a class="wheel-item" data-pos="1" href="mixes.html">mixes</a>
            <a class="wheel-item" data-pos="2" href="consume.html">consume</a>
        </nav>
    </main>

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const visitorLocation = document.getElementById("visitor-location");
        const browserTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

        async function locateVisitorByIp() {
            try {
                const response = await fetch(
                    "https://ipwho.is/?fields=success,city,region,country_code",
                    { cache: "no-store" }
                );
                const location = await response.json();
                const locationName = location.success
                    && (location.city || location.region || location.country_code);

                if (locationName) {
                    visitorLocation.textContent = locationName;
                }
            } catch {
                // Keep the browser timezone fallback when IP geolocation is unavailable.
            }
        }

        visitorLocation.textContent = browserTimeZone.split("/").pop().replaceAll("_", " ");
        locateVisitorByIp();

        // Word wheel: swiping, scrolling or the arrow keys bring the next word into the middle.
        const wheelItems = [...document.querySelectorAll(".wheel-item")];
        let activeIndex = wheelItems.findIndex((item) => item.dataset.pos === "0");

        // A word leaving one end reappears at the other; this copy fades out where it left.
        function leaveGhost(item, exitPos) {
            const ghost = item.cloneNode(true);
            ghost.setAttribute("aria-hidden", "true");
            ghost.tabIndex = -1;
            item.after(ghost);
            ghost.offsetWidth;
            ghost.dataset.pos = exitPos;
            setTimeout(() => ghost.remove(), 400);
        }

        // direction 1 brings up the word below the middle, -1 brings down the word above it.
        function turnWheel(direction) {
            const count = wheelItems.length;
            activeIndex = (activeIndex + direction + count) % count;

            wheelItems.forEach((item, index) => {
                const previous = Number(item.dataset.pos);
                const pos = ((index - activeIndex + 2) % count + count) % count - 2;

                if (Math.abs(pos - previous) > 1) {
                    leaveGhost(item, previous - direction);
                    item.classList.add("is-teleporting");
                    item.dataset.pos = pos + direction;
                    item.offsetWidth;
                    item.classList.remove("is-teleporting");
                }

                item.dataset.pos = pos;
            });
        }

        let wheelTravel = 0;
        let lastWheelEvent = 0;
        let lastWheelTurn = 0;

        window.addEventListener("wheel", (event) => {
            if (event.timeStamp - lastWheelEvent > 150) {
                wheelTravel = 0;
            }
            lastWheelEvent = event.timeStamp;

            // Trackpads keep sending events after the fingers lift: wait before turning again.
            if (event.timeStamp - lastWheelTurn < 450) {
                return;
            }

            wheelTravel += event.deltaY;
            if (Math.abs(wheelTravel) >= 40) {
                turnWheel(Math.sign(wheelTravel));
                wheelTravel = 0;
                lastWheelTurn = event.timeStamp;
            }
        }, { passive: true });

        let touchY = null;

        window.addEventListener("touchstart", (event) => {
            touchY = event.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchmove", (event) => {
            const travel = touchY - event.touches[0].clientY;
            if (Math.abs(travel) >= 44) {
                turnWheel(Math.sign(travel));
                touchY = event.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener("keydown", (event) => {
            if (event.key === "ArrowDown") {
                turnWheel(1);
            } else if (event.key === "ArrowUp") {
                turnWheel(-1);
            }
        });
    </script>
    <script src="router.js"></script>
</body>
</html>
