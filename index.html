<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scene i</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            overflow: hidden;
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
        }

        #lotus-art {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .time-location {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 14px;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .local-time {
            color: #aaa;
        }

        .home-mark {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
        }

        .center-i {
            color: #000;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            font-size: 34px;
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
        }

        .center-i:hover,
        .center-i:focus-visible,
        .orbit-link:hover,
        .orbit-link:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .center-i:focus-visible,
        .orbit-link:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .orbit-item {
            --radius: clamp(86px, 12.5vw, 126px);
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            width: 0;
            height: 0;
            transform-origin: 0 0;
        }

        .orbit-item.mixes {
            transform: rotate(32deg);
        }

        .orbit-item.consume {
            transform: rotate(146deg);
        }

        .orbit-item.contact {
            transform: rotate(218deg);
        }

        .orbit-item.blog {
            transform: rotate(326deg);
        }

        .orbit-link {
            display: inline-block;
            color: #000;
            font-size: clamp(14px, 1.35vw, 17px);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            white-space: nowrap;
            transform: translateX(var(--radius)) rotate(-32deg);
        }

        .orbit-item.consume .orbit-link {
            transform: translateX(var(--radius)) rotate(-146deg);
        }

        .orbit-item.contact .orbit-link {
            transform: translateX(var(--radius)) rotate(-218deg);
        }

        .orbit-item.blog .orbit-link {
            transform: translateX(var(--radius)) rotate(-326deg);
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .time-location {
                left: auto;
                right: 20px;
                gap: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="lotus-art" aria-hidden="true"></canvas>

    <div class="time-location" aria-label="Local time and location">
        <time class="local-time" id="local-time"></time>
        <span id="visitor-location"></span>
    </div>

    <main class="home-mark" aria-label="scene i">
        <a class="center-i" href="index.html">i</a>
    </main>

    <div class="orbit-item mixes">
        <a class="orbit-link" href="mixes.html">mixes</a>
    </div>

    <div class="orbit-item consume">
        <a class="orbit-link" href="consume.html">consume</a>
    </div>

    <div class="orbit-item contact">
        <a class="orbit-link" href="contact.html">contact</a>
    </div>

    <div class="orbit-item blog">
        <a class="orbit-link" href="blog-empty.html">blog</a>
    </div>

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const lotusCanvas = document.getElementById("lotus-art");
        const lotusContext = lotusCanvas.getContext("2d");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const bloomDuration = 6200;
        let bloomStart;
        let bloomFrame;
        let bloomComplete = false;

        const petals = [
            { angle: -68, length: 112, width: 48, delay: 0.04, baseX: -5, baseY: 5 },
            { angle: 68, length: 112, width: 48, delay: 0.08, baseX: 5, baseY: 5 },
            { angle: -48, length: 145, width: 56, delay: 0.13, baseX: -3, baseY: 2 },
            { angle: 48, length: 145, width: 56, delay: 0.18, baseX: 3, baseY: 2 },
            { angle: -28, length: 172, width: 60, delay: 0.24, baseX: -2, baseY: 0 },
            { angle: 28, length: 172, width: 60, delay: 0.30, baseX: 2, baseY: 0 },
            { angle: 0, length: 190, width: 66, delay: 0.36, baseX: 0, baseY: -2 },
            { angle: -57, length: 94, width: 55, delay: 0.42, baseX: -4, baseY: -2 },
            { angle: 57, length: 94, width: 55, delay: 0.47, baseX: 4, baseY: -2 },
            { angle: -34, length: 128, width: 55, delay: 0.52, baseX: -2, baseY: -4 },
            { angle: 34, length: 128, width: 55, delay: 0.57, baseX: 2, baseY: -4 },
            { angle: -14, length: 150, width: 50, delay: 0.62, baseX: -1, baseY: -6 },
            { angle: 14, length: 150, width: 50, delay: 0.67, baseX: 1, baseY: -6 },
            { angle: 0, length: 126, width: 44, delay: 0.73, baseX: 0, baseY: -8 }
        ];

        function easeOutCubic(value) {
            return 1 - Math.pow(1 - value, 3);
        }

        function easeInOutCubic(value) {
            return value < 0.5
                ? 4 * value * value * value
                : 1 - Math.pow(-2 * value + 2, 3) / 2;
        }

        function sizeLotusCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            lotusCanvas.width = Math.round(window.innerWidth * pixelRatio);
            lotusCanvas.height = Math.round(window.innerHeight * pixelRatio);
            lotusContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        }

        function drawPetal(petal, progress) {
            if (progress <= 0) return;

            const growth = easeOutCubic(progress);
            const openingAngle = petal.angle * growth;
            const length = petal.length * (0.12 + growth * 0.88);
            const width = petal.width * (0.18 + growth * 0.82);

            lotusContext.save();
            lotusContext.translate(petal.baseX, petal.baseY);
            lotusContext.rotate(openingAngle * Math.PI / 180);
            lotusContext.beginPath();
            lotusContext.moveTo(0, 5);
            lotusContext.bezierCurveTo(-width * 0.68, -length * 0.27, -width * 0.58, -length * 0.72, 0, -length);
            lotusContext.bezierCurveTo(width * 0.58, -length * 0.72, width * 0.68, -length * 0.27, 0, 5);
            lotusContext.closePath();
            lotusContext.fillStyle = "#fff";
            lotusContext.fill();
            lotusContext.strokeStyle = "#000";
            lotusContext.lineWidth = 1.45;
            lotusContext.lineJoin = "round";
            lotusContext.stroke();

            lotusContext.beginPath();
            lotusContext.moveTo(0, 2);
            lotusContext.bezierCurveTo(-width * 0.08, -length * 0.35, width * 0.06, -length * 0.68, 0, -length * 0.94);
            lotusContext.strokeStyle = "rgba(0, 0, 0, 0.38)";
            lotusContext.lineWidth = 0.7;
            lotusContext.stroke();
            lotusContext.restore();
        }

        function drawLotus(frameTime = 0) {
            if (bloomStart === undefined) bloomStart = frameTime;

            const width = window.innerWidth;
            const height = window.innerHeight;
            const rawProgress = reducedMotion.matches
                ? 1
                : Math.min((frameTime - bloomStart) / bloomDuration, 1);
            const travel = easeInOutCubic(rawProgress);
            const startX = width + Math.min(width, height) * 0.23;
            const startY = height + Math.min(width, height) * 0.22;
            const endX = width * (width <= 650 ? 0.23 : 0.15);
            const endY = height * (width <= 650 ? 0.21 : 0.28);
            const x = startX + (endX - startX) * travel;
            const y = startY + (endY - startY) * travel;
            const scale = width <= 650
                ? Math.max(0.44, Math.min(0.58, Math.min(width, height) / 760))
                : Math.max(0.54, Math.min(1.22, Math.min(width, height) / 720));
            const driftAngle = (1 - travel) * 11 * Math.PI / 180;

            lotusContext.clearRect(0, 0, width, height);
            lotusContext.save();
            lotusContext.translate(x, y);
            lotusContext.rotate(driftAngle);
            lotusContext.scale(scale, scale);

            petals.forEach((petal) => {
                const petalProgress = Math.max(0, Math.min((rawProgress - petal.delay) / 0.23, 1));
                drawPetal(petal, petalProgress);
            });

            const baseProgress = Math.max(0, Math.min((rawProgress - 0.63) / 0.24, 1));
            if (baseProgress > 0) {
                const baseWidth = 151 * easeOutCubic(baseProgress);
                lotusContext.beginPath();
                lotusContext.moveTo(-baseWidth, -2);
                lotusContext.bezierCurveTo(-baseWidth * 0.68, 52, baseWidth * 0.68, 52, baseWidth, -2);
                lotusContext.bezierCurveTo(baseWidth * 0.56, 75, -baseWidth * 0.56, 75, -baseWidth, -2);
                lotusContext.closePath();
                lotusContext.fillStyle = "#fff";
                lotusContext.fill();
                lotusContext.strokeStyle = "#000";
                lotusContext.lineWidth = 1.45;
                lotusContext.stroke();

                [-0.66, -0.33, 0, 0.33, 0.66].forEach((position) => {
                    lotusContext.beginPath();
                    lotusContext.moveTo(position * baseWidth, 12);
                    lotusContext.quadraticCurveTo(position * baseWidth * 0.45, 43, 0, 55);
                    lotusContext.strokeStyle = "rgba(0, 0, 0, 0.32)";
                    lotusContext.lineWidth = 0.65;
                    lotusContext.stroke();
                });
            }
            lotusContext.restore();

            if (rawProgress < 1) {
                bloomFrame = requestAnimationFrame(drawLotus);
            } else {
                bloomComplete = true;
            }
        }

        function restartLotus() {
            cancelAnimationFrame(bloomFrame);
            sizeLotusCanvas();
            if (bloomComplete || reducedMotion.matches) {
                bloomStart = 0;
                drawLotus(bloomDuration);
            } else {
                bloomStart = undefined;
                bloomFrame = requestAnimationFrame(drawLotus);
            }
        }

        window.addEventListener("resize", restartLotus);
        reducedMotion.addEventListener("change", restartLotus);
        restartLotus();

        const localTime = document.getElementById("local-time");
        const visitorLocation = document.getElementById("visitor-location");
        const visitorTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        const localTimeFormat = new Intl.DateTimeFormat("en-US", {
            timeZone: visitorTimeZone,
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });

        function getLocationName(timeZone) {
            const timeZoneParts = timeZone.split("/");
            const locationName = timeZoneParts[timeZoneParts.length - 1];

            return locationName.replaceAll("_", " ");
        }

        function updateLocalTime() {
            const now = new Date();
            const timeParts = Object.fromEntries(
                localTimeFormat.formatToParts(now).map(({ type, value }) => [type, value])
            );

            localTime.textContent = `${timeParts.hour}:${timeParts.minute} ${timeParts.dayPeriod}`;
            localTime.dateTime = now.toISOString();
        }

        visitorLocation.textContent = getLocationName(visitorTimeZone);
        updateLocalTime();
        setInterval(updateLocalTime, 30000);
    </script>
</body>
</html>
