name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate site and security policy
        run: python3 scripts/build_site.py

      - name: Validate production output and security policy
        run: python3 scripts/security_check.py

      - name: Scan current tree and Git history for secrets
        run: sh scripts/scan_secrets.sh --history
