# Build only the explicitly allowlisted public site. Repository files outside
# dist/ are never part of the deploy.
[build]
  command = "python3 scripts/build_site.py"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'none'; media-src 'self'; object-src 'none'; script-src 'sha256-0TU3KCQMBB/o2VC+vFdLGaYggrzo/SXDs5QSGuReLew=' 'sha256-O1K8QsYYOlrjN6AiN7zxISgCP6D7MWZ0DkHNit7Rfdc=' 'sha256-pzu7rHH6bD0MMJq87tSZE8RmL30cIdwepAI6nJ6CrqM='; style-src 'unsafe-inline'; worker-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Permitted-Cross-Domain-Policies = "none"
