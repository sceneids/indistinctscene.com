<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scene i</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            overflow: hidden;
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
        }

        #generative-art {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .time-location {
            position: fixed;
            top: 18px;
            left: 55%;
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 14px;
            color: #222;
            font-family: "Times New Roman", Times, serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .local-time {
            color: #aaa;
        }

        .home-mark {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
        }

        .center-i {
            color: #000;
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            font-size: 34px;
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
        }

        .center-i:hover,
        .center-i:focus-visible,
        .orbit-link:hover,
        .orbit-link:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .center-i:focus-visible,
        .orbit-link:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .orbit-item {
            --radius: clamp(82px, 11vw, 110px);
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 2;
            width: 0;
            height: 0;
            transform-origin: 0 0;
        }

        .orbit-item.mixes {
            transform: rotate(0deg);
        }

        .orbit-item.consume {
            transform: rotate(120deg);
        }

        .orbit-item.contact {
            transform: rotate(240deg);
        }

        .orbit-link {
            display: inline-block;
            color: #000;
            font-size: clamp(14px, 1.35vw, 17px);
            font-weight: 400;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            white-space: nowrap;
            transform: translateX(var(--radius)) rotate(0deg);
        }

        .orbit-item.consume .orbit-link {
            transform: translateX(var(--radius)) rotate(-120deg);
        }

        .orbit-item.contact .orbit-link {
            transform: translateX(var(--radius)) rotate(-240deg);
        }

        .copyright {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 2;
            margin: 0;
            font-size: 11px;
            line-height: 1;
            transform: translateX(-50%);
        }

        @media (max-width: 650px) {
            .time-location {
                left: auto;
                right: 20px;
                gap: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="generative-art" aria-hidden="true"></canvas>

    <div class="time-location" aria-label="Local time and location">
        <time class="local-time" id="local-time"></time>
        <span id="visitor-location"></span>
    </div>

    <main class="home-mark" aria-label="scene i">
        <a class="center-i" href="index.html">i</a>
    </main>

    <div class="orbit-item mixes">
        <a class="orbit-link" href="mixes.html">mixes</a>
    </div>

    <div class="orbit-item consume">
        <a class="orbit-link" href="consume.html">consume</a>
    </div>

    <div class="orbit-item contact">
        <a class="orbit-link" href="contact.html">contact</a>
    </div>

    <footer class="copyright">&copy; 2026</footer>

    <script>
        const artCanvas = document.getElementById("generative-art");
        const artContext = artCanvas.getContext("2d");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        let artTime = 0;
        let artFrame;

        function sizeArtCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
            artCanvas.width = Math.round(window.innerWidth * pixelRatio);
            artCanvas.height = Math.round(window.innerHeight * pixelRatio);
            artContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        }

        function drawGenerativeArt(frameTime = 0) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const scale = Math.min(width, height) / 470;
            const swimTime = frameTime / 1000;
            const swimX = Math.sin(swimTime * 0.24) * width * 0.22
                + Math.sin(swimTime * 0.11) * width * 0.06;
            const swimY = Math.cos(swimTime * 0.19) * height * 0.16
                + Math.sin(swimTime * 0.13) * height * 0.05;
            const originX = width / 2 - 200 * scale + swimX;
            // The sketch's plotted mass sits low in its original 400px coordinate space.
            const originY = height / 2 - 330 * scale + swimY;

            artContext.clearRect(0, 0, width, height);
            artContext.fillStyle = "rgba(0, 0, 0, 0.48)";

            for (let i = 10000; i > 0; i -= 1) {
                const y = i / 235;
                const k = (4 + Math.cos(i / 9 - artTime * 2)) * Math.cos(i / 35);
                const e = y / 7 - 13;
                const d = Math.hypot(k, e);
                const q = 2 * Math.sin(k * 3)
                    - y / 35 * k * (9 + k * Math.sin(Math.cos(e) * 9 - d * 2 + artTime));
                const c = d - artTime;
                const x = q + 40 * Math.cos(c) + 200;
                const pointY = q * Math.sin(c) + d * 35;

                artContext.fillRect(
                    originX + x * scale,
                    originY + pointY * scale,
                    Math.max(0.7, scale * 0.75),
                    Math.max(0.7, scale * 0.75)
                );
            }

            if (!reduceMotion.matches) {
                artTime += Math.PI / 80;
                artFrame = requestAnimationFrame(drawGenerativeArt);
            }
        }

        function restartGenerativeArt() {
            cancelAnimationFrame(artFrame);
            sizeArtCanvas();
            drawGenerativeArt();
        }

        window.addEventListener("resize", restartGenerativeArt);
        reduceMotion.addEventListener("change", restartGenerativeArt);
        restartGenerativeArt();

        const localTime = document.getElementById("local-time");
        const visitorLocation = document.getElementById("visitor-location");
        const visitorTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        const localTimeFormat = new Intl.DateTimeFormat("en-US", {
            timeZone: visitorTimeZone,
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });

        function getLocationName(timeZone) {
            const timeZoneParts = timeZone.split("/");
            const locationName = timeZoneParts[timeZoneParts.length - 1];

            return locationName.replaceAll("_", " ");
        }

        function updateLocalTime() {
            const now = new Date();
            const timeParts = Object.fromEntries(
                localTimeFormat.formatToParts(now).map(({ type, value }) => [type, value])
            );

            localTime.textContent = `${timeParts.hour}:${timeParts.minute} ${timeParts.dayPeriod}`;
            localTime.dateTime = now.toISOString();
        }

        visitorLocation.textContent = getLocationName(visitorTimeZone);
        updateLocalTime();
        setInterval(updateLocalTime, 30000);
    </script>
</body>
</html>
