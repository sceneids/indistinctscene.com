    <style>

        .site-home-i {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 2;
            transform: translateX(-50%);
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            align-items: start;
            column-gap: clamp(24px, 3vw, 44px);
            row-gap: clamp(40px, 6vh, 72px);
            padding: 6vh 4vw 10vh;
        }

        .spot {
            margin: 0;
            width: 100%;
        }

        .spot img {
            display: block;
            width: 100%;
            height: auto;
        }

        .c1-6 { grid-column: 1 / span 6; }
        .c1-5 { grid-column: 1 / span 5; }
        .c1-4 { grid-column: 1 / span 4; }
        .c5-4 { grid-column: 5 / span 4; }
        .c8-5 { grid-column: 8 / span 5; }
        .c9-4 { grid-column: 9 / span 4; }

        @media (max-width: 800px) {
            .photos {
                display: flex;
                flex-direction: column;
                gap: 6vh;
                padding: 7vh 6vw 10vh;
            }

            .spot {
                width: min(86vw, 540px);
                grid-column: auto;
            }

            .spot.port {
                width: min(64vw, 360px);
            }

            .spot:nth-child(odd) {
                align-self: flex-start;
            }

            .spot:nth-child(even) {
                align-self: flex-end;
            }
        }
    </style>
</head>
