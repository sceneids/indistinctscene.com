<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
        }

        .site-home-i {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 2;
            color: #000;
            font-size: 18px;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            transform: translateX(-50%);
            mix-blend-mode: difference;
        }

        .site-home-i:hover,
        .site-home-i:focus-visible {
            color: #fff;
            background: #000;
            mix-blend-mode: normal;
            text-decoration: none;
        }

        .site-home-i:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px;
        }

        .photos img {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 800px) {
            .photos {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .photos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
