        .row {
            display: flex;
            gap: 6px;
        }

        /* flex-grow equals each photo's aspect ratio, so both photos in a row end up the same height */

            flex: 1.5088 1 0;
            min-width: 0;
            margin: 0;
        }

        .spot.port {
            flex: 0.6628 1 0;
        }

        .spot img {
            display: block;
            width: 100%;
            height: auto;

            .row {

        }
