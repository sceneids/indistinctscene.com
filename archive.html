<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
        }

        .site-home-i {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 2;
            color: #000;
            font-size: 18px;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            transform: translateX(-50%);
        }

        .site-home-i:hover,
        .site-home-i:focus-visible {
            color: #fff;
            background: #000;
            mix-blend-mode: normal;
            text-decoration: none;
        }

        .site-home-i:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .photos {
            display: flex;
            flex-direction: column;
            padding: 16vh 5vw 28vh;
        }

        .spot {
            margin: 0;
        }

        .spot img {
            display: block;
            width: 100%;
            height: auto;
        }

        .left {
            align-self: flex-start;
        }

        .right {
            align-self: flex-end;
        }

        .mid {
            align-self: center;
        }

        .mid-left {
            align-self: flex-start;
            margin-left: 14vw;
        }

        .mid-right {
            align-self: flex-end;
            margin-right: 12vw;
        }

        .landscape.lg {
            width: min(46vw, 600px);
        }

        .landscape.md {
            width: min(36vw, 460px);
        }

        .landscape.sm {
            width: min(28vw, 360px);
        }

        .portrait {
            width: min(22vw, 300px);
        }

        .space-xl {
            margin-bottom: 28vh;
        }

        .space-lg {
            margin-bottom: 22vh;
        }

        .space-md {
            margin-bottom: 16vh;
        }

        .space-sm {
            margin-bottom: 10vh;
        }

        @media (max-width: 800px) {
            .photos {
                padding: 14vh 7vw 22vh;
            }

            .landscape.lg,
            .landscape.md,
            .landscape.sm {
                width: min(78vw, 520px);
            }

            .portrait {
                width: min(56vw, 320px);
            }

            .mid-left,
            .mid-right {
                margin-left: 0;
                margin-right: 0;
            }

            .space-xl {
                margin-bottom: 18vh;
            }

            .space-lg {
                margin-bottom: 14vh;
            }

            .space-md,
            .space-sm {
                margin-bottom: 12vh;
            }
        }
    </style>
</head>
