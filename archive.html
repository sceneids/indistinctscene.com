<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>archive</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
        }

        .site-home-i {
            position: fixed;
            top: 18px;
            left: 50%;
            z-index: 2;
            color: #000;
            font-size: 18px;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            transform: translateX(-50%);
        }

        .site-home-i:hover,
        .site-home-i:focus-visible {
            color: #fff;
            background: #000;
            text-decoration: none;
        }

        .site-home-i:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            align-items: start;
            column-gap: clamp(16px, 2vw, 28px);
            row-gap: clamp(20px, 2.4vh, 32px);
            padding: 6vh 4vw 10vh;
        }

        .spot {
            margin: 0;
            width: 100%;
        }

        .spot img {
            display: block;
            width: 100%;
            height: auto;
        }

        .c1-6 { grid-column: 1 / span 6; }
        .c1-5 { grid-column: 1 / span 5; }
        .c1-4 { grid-column: 1 / span 4; }
        .c5-4 { grid-column: 5 / span 4; }
        .c8-5 { grid-column: 8 / span 5; }
        .c9-4 { grid-column: 9 / span 4; }

        @media (max-width: 800px) {
            .photos {
                display: flex;
                flex-direction: column;
                gap: 3.5vh;
                padding: 7vh 6vw 10vh;
            }

            .spot {
                width: min(86vw, 540px);
                grid-column: auto;
            }

            .spot.port {
                width: min(64vw, 360px);
            }

            .spot:nth-child(odd) {
                align-self: flex-start;
            }

            .spot:nth-child(even) {
                align-self: flex-end;
            }
        }
    </style>
</head>
