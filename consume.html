<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>consume</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #fff;
            color: #000;
            font-family: "Times New Roman", Times, serif;
            font-size: 13px;
            font-weight: 300;
            line-height: 1.08;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            text-decoration: underline;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 1px solid #000;
            outline-offset: 4px;
        }

        .site-home-i {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 20;
            color: #000;
            font-size: 18px;
            line-height: 1;
            text-decoration: none;
            text-transform: lowercase;
            transform: translate(-50%, -50%);
        }

        .brand {
            position: fixed;
            left: clamp(34px, 4.6vw, 92px);
            top: 21vh;
            z-index: 10;
            font-size: clamp(22px, 2vw, 36px);
            font-weight: 300;
            line-height: 0.9;
            letter-spacing: 0;
            text-transform: lowercase;
        }

        .year-nav {
            position: fixed;
            left: clamp(36px, 4.7vw, 94px);
            bottom: 7vh;
            z-index: 10;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .year-nav a {
            display: inline-block;
            font-size: 12px;
            font-weight: 300;
            line-height: 1;
        }

        .catalog {
            margin-left: clamp(260px, 26vw, 520px);
        }

        .product {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(250px, 330px) minmax(520px, 1fr);
            align-items: stretch;
        }

        .product-copy {
            align-self: center;
            max-width: 310px;
            padding: 11vh 28px 11vh 0;
            font-weight: 300;
        }

        .product-kicker {
            position: relative;
            margin: 0 0 16px;
        }

        .product-kicker::before {
            content: "";
            position: absolute;
            left: -14px;
            top: 0.45em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
        }

        .product-copy h1,
        .product-copy h2 {
            margin: 0 0 17px;
            font: inherit;
        }

        .product-copy p {
            margin: 0 0 17px;
        }

        .credits {
            color: #777;
            text-transform: lowercase;
        }

        .player {
            position: relative;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 4px 12px;
            margin: 0 0 22px;
        }

        .player-toggle {
            grid-row: span 2;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid #000;
            border-radius: 50%;
            background: #fff;
            color: #000;
            cursor: pointer;
        }

        .player-toggle:hover {
            background: #000;
            color: #fff;
        }

        .player-toggle svg {
            display: block;
            width: 12px;
            height: 12px;
            margin: auto;
            fill: currentColor;
        }

        .player-toggle .icon-pause,
        .player.is-playing .icon-play {
            display: none;
        }

        .player.is-playing .icon-pause {
            display: block;
        }

        .player-toggle:disabled {
            border-color: #bbb;
            color: #bbb;
            background: #fff;
            cursor: default;
        }

        .player-seek {
            width: 100%;
            height: 12px;
            margin: 0;
            background: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .player-seek::-webkit-slider-runnable-track {
            height: 1px;
            background: linear-gradient(#000, #000) 0 / var(--progress, 0%) 100% no-repeat, #ccc;
        }

        .player-seek::-moz-range-track {
            height: 1px;
            background: #ccc;
        }

        .player-seek::-moz-range-progress {
            height: 1px;
            background: #000;
        }

        .player-seek::-webkit-slider-thumb {
            width: 7px;
            height: 7px;
            margin-top: -3px;
            border: 0;
            border-radius: 50%;
            background: #000;
            -webkit-appearance: none;
        }

        .player-seek::-moz-range-thumb {
            width: 7px;
            height: 7px;
            border: 0;
            border-radius: 50%;
            background: #000;
        }

        .sc-frame {
            position: absolute;
            width: 1px;
            height: 1px;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        .player-time {
            font-size: 11px;
            color: #777;
            font-variant-numeric: tabular-nums;
        }

        .stream {
            margin-top: 0;
            color: #777;
            text-transform: lowercase;
        }

        .stream a {
            color: #000;
        }

        .product-photo {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: clamp(26px, 4vw, 72px);
            background: #fbfbfb;
        }

        .product-photo img {
            display: block;
            width: 100%;
            height: 100%;
            max-height: 82vh;
            object-fit: contain;
        }

        .product:nth-child(even) .product-photo {
            background: #fff;
        }

        @media (max-width: 980px) {
            body {
                font-size: 12px;
            }

            .brand,
            .year-nav {
                position: static;
            }

            .brand {
                display: inline-block;
                margin: 22px 22px 28px;
            }

            .year-nav {
                flex-direction: row;
                gap: 18px;
                margin: 0 22px 28px;
                writing-mode: horizontal-tb;
            }

            .catalog {
                margin-left: 0;
            }

            .product {
                min-height: auto;
                grid-template-columns: 1fr;
            }

            .product-copy {
                max-width: 420px;
                padding: 0 22px 28px;
            }

            .product-kicker::before {
                left: -10px;
            }

            .product-photo {
                min-height: 62vh;
                padding: 24px;
            }

            .product-photo img {
                max-height: 58vh;
            }
        }
    </style>
</head>
<body>
    <a class="site-home-i" href="index.html">i</a>

    <a class="brand" href="index.html">consume</a>

    <nav aria-label="release years">
        <ul class="year-nav">
            <li><a href="#releases-2026">2026</a></li>
        </ul>
    </nav>

    <main class="catalog" aria-label="consume catalog">
        <article class="product" id="releases-2026">
            <section class="product-copy" aria-label="make a wish">
                <p class="product-kicker">single (2026)</p>
                <h1>MAKE A WISH</h1>
                <p class="credits">eyeds ft sincewhn, prod. eyeds &amp; sincewhn</p>
                <div class="player" data-track="2424256314">
                    <button class="player-toggle" type="button" aria-label="Play make a wish" disabled>
                        <svg class="icon-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 0l10 6-10 6z" /></svg>
                        <svg class="icon-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 0h4v12H1zM7 0h4v12H7z" /></svg>
                    </button>
                    <input class="player-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek make a wish" disabled />
                    <span class="player-time">0:00 / 0:00</span>
                </div>
                <p class="stream">
                    stream on <a href="https://soundcloud.com/eyedscyou/eyeds-make-a-wish-ft-sincewhen">soundcloud</a>
                </p>
            </section>
            <figure class="product-photo">
                <img src="covers/make-a-wish.jpg" alt="make a wish cover art" width="1024" height="1024" />
            </figure>
        </article>

        <article class="product" id="fake">
            <section class="product-copy" aria-label="fake">
                <p class="product-kicker">single (2026)</p>
                <h2>FAKE</h2>
                <p class="credits">eyeds ft yung berry, prod. eyeds</p>
                <div class="player" data-track="2409497793">
                    <button class="player-toggle" type="button" aria-label="Play fake" disabled>
                        <svg class="icon-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 0l10 6-10 6z" /></svg>
                        <svg class="icon-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 0h4v12H1zM7 0h4v12H7z" /></svg>
                    </button>
                    <input class="player-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek fake" disabled />
                    <span class="player-time">0:00 / 0:00</span>
                </div>
                <p class="stream">
                    stream on <a href="https://soundcloud.com/eyedscyou/all-the-same-ft-yung-bery-prod">soundcloud</a>
                </p>
            </section>
            <figure class="product-photo">
                <img src="covers/fake.jpg" alt="fake cover art" width="1024" height="1024" loading="lazy" />
            </figure>
        </article>
    </main>

    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        const players = [...document.querySelectorAll('.player')];

        function formatTime(ms) {
            const whole = Math.floor((ms || 0) / 1000);
            return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
        }

        players.forEach((player) => {
            const toggle = player.querySelector('.player-toggle');
            const seek = player.querySelector('.player-seek');
            const time = player.querySelector('.player-time');
            const title = toggle.getAttribute('aria-label').replace(/^Play /, '');
            let duration = 0;
            let position = 0;

            const frame = document.createElement('iframe');
            frame.className = 'sc-frame';
            frame.title = `${title} on SoundCloud`;
            frame.allow = 'autoplay; encrypted-media';
            frame.tabIndex = -1;
            frame.setAttribute('aria-hidden', 'true');
            frame.src = 'https://w.soundcloud.com/player/?' + new URLSearchParams({
                url: `https://api.soundcloud.com/tracks/${player.dataset.track}`,
                auto_play: 'false',
                buying: 'false',
                sharing: 'false',
                download: 'false',
                show_artwork: 'false',
                show_comments: 'false',
                show_playcount: 'false',
                visual: 'false',
            });
            player.appendChild(frame);

            const widget = SC.Widget(frame);
            player.widget = widget;

            function render() {
                const progress = duration ? (position / duration) * 100 : 0;
                seek.value = progress;
                seek.style.setProperty('--progress', `${progress}%`);
                time.textContent = `${formatTime(position)} / ${formatTime(duration)}`;
            }

            function setPlaying(playing) {
                player.classList.toggle('is-playing', playing);
                toggle.setAttribute('aria-label', `${playing ? 'Pause' : 'Play'} ${title}`);
            }

            widget.bind(SC.Widget.Events.READY, () => {
                widget.getDuration((ms) => {
                    duration = ms;
                    toggle.disabled = false;
                    seek.disabled = false;
                    render();
                });
            });

            widget.bind(SC.Widget.Events.PLAY_PROGRESS, (event) => {
                position = event.currentPosition;
                render();
            });

            widget.bind(SC.Widget.Events.PLAY, () => {
                players.forEach((other) => other !== player && other.widget.pause());
                setPlaying(true);
            });

            widget.bind(SC.Widget.Events.PAUSE, () => setPlaying(false));

            widget.bind(SC.Widget.Events.FINISH, () => {
                setPlaying(false);
                position = 0;
                render();
            });

            toggle.addEventListener('click', () => widget.toggle());

            seek.addEventListener('input', () => {
                position = (seek.value / 100) * duration;
                widget.seekTo(position);
                render();
            });
        });
    </script>
    <script src="router.js"></script>
</body>
</html>
